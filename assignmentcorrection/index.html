<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>DOM Practice Assignment</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>

    <!-- <h1 style="display: flex; background-color: aqua;">DOM Manipulation Practice</h1> -->
    <h1>DOM Manipulation Practice</h1>
    <!-- The Box -->
    <div id="color-box">Change Me</div>

    <!-- Buttons to change the box -->
    <div class="controls">
        <button id="btn-change-color">Change Color</button>
        <button id="btn-reset">Reset Box</button>
    </div>

    <!-- Input to change text -->
    <div class="controls">
        <input type="text" id="text-input" placeholder="Type new box text...">
        <button id="btn-change-text">Update Text</button>
    </div>

    <!-- List addition section -->
    <div class="controls">
        <input type="text" id="item-input" placeholder="New list item...">
        <button id="btn-add-item">Add to List</button>
    </div>

    <ul id="item-list">
        <li>Initial Item 1</li>
    </ul>

    <!-- Link your JavaScript file -->
    <script src="script.js"></script>
</body>
</html>
>
